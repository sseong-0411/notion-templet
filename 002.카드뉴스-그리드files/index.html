<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게시물 갤러리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─── Reset & Base ──────────────────────────────── */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg-primary: #f6f5f1;
  --bg-card: #ffffff;
  --bg-carousel: #e8e6e1;
  --text-primary: #1a1a1a;
  --text-secondary: #6b6560;
  --text-tertiary: #9e9893;
  --border: #e2dfd9;
  --border-light: #f0ede8;
  --accent: #2d2926;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.04);
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;

  /* 상태별 색상 */
  --status-draft: #9e9893;
  --status-designing: #5b8def;
  --status-review: #e6a817;
  --status-scheduled: #e07c3a;
  --status-published: #3da06e;
  --status-archived: #8b7355;

  /* 유형별 색상 */
  --type-feed11: #3da06e;
  --type-feed45: #5b8def;
  --type-story: #a855c6;
  --type-reels: #e05a8a;
}

html {
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
}

/* ─── Header ────────────────────────────────────── */
.header {
  padding: 2rem 2rem 1.5rem;
  max-width: 1400px;
  margin: 0 auto;
}

.header__title {
  font-family: 'Outfit', sans-serif;
  font-size: 1.75rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--accent);
}

.header__subtitle {
  font-size: 0.85rem;
  color: var(--text-tertiary);
  margin-top: 0.25rem;
}

/* ─── Toolbar ───────────────────────────────────── */
.toolbar {
  padding: 0 2rem 1.5rem;
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.filter-btn {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.8rem;
  font-weight: 500;
  padding: 0.4rem 0.85rem;
  border: 1px solid var(--border);
  border-radius: 100px;
  background: var(--bg-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}

.filter-btn:hover {
  border-color: var(--text-secondary);
  color: var(--text-primary);
}

.filter-btn.active {
  background: var(--accent);
  color: #ffffff;
  border-color: var(--accent);
}

.toolbar__spacer {
  flex: 1;
}

.toolbar__count {
  font-size: 0.8rem;
  color: var(--text-tertiary);
  font-variant-numeric: tabular-nums;
}

.refresh-btn {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.8rem;
  font-weight: 500;
  padding: 0.4rem 0.85rem;
  border: 1px solid var(--border);
  border-radius: 100px;
  background: var(--bg-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 0.35rem;
}

.refresh-btn:hover {
  border-color: var(--text-secondary);
  color: var(--text-primary);
}

.refresh-btn.loading .refresh-icon {
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ─── Grid ──────────────────────────────────────── */
.grid {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 2rem 3rem;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1.25rem;
}

@media (max-width: 720px) {
  .header, .toolbar, .grid {
    padding-left: 1rem;
    padding-right: 1rem;
  }
  .grid {
    grid-template-columns: 1fr;
  }
}

/* ─── Card ──────────────────────────────────────── */
.card {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  transition: box-shadow 0.25s ease, transform 0.25s ease;
  display: flex;
  flex-direction: column;
}

.card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}

/* ─── Carousel ──────────────────────────────────── */
.carousel {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  background: var(--bg-carousel);
  overflow: hidden;
}

.carousel--ratio-45 {
  aspect-ratio: 4 / 5;
}

.carousel--ratio-story {
  aspect-ratio: 9 / 16;
  max-height: 480px;
}

.carousel__track {
  display: flex;
  width: 100%;
  height: 100%;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  -ms-overflow-style: none;
  scroll-behavior: smooth;
}

.carousel__track::-webkit-scrollbar {
  display: none;
}

.carousel__slide {
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  scroll-snap-align: start;
  display: flex;
  align-items: center;
  justify-content: center;
}

.carousel__slide img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.carousel__slide--figma {
  padding: 0;
}

.carousel__slide--figma iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* 카루셀 내비게이션 버튼 */
.carousel__nav-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(4px);
  color: var(--text-primary);
  font-size: 0.85rem;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  z-index: 2;
}

.card:hover .carousel__nav-btn,
.carousel__nav-btn:focus {
  opacity: 1;
}

.carousel__nav-btn--prev { left: 8px; }
.carousel__nav-btn--next { right: 8px; }

.carousel__nav-btn:disabled {
  opacity: 0 !important;
  cursor: default;
}

/* 인디케이터 (도트) */
.carousel__dots {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 5px;
  z-index: 2;
}

.carousel__dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.5);
  transition: background 0.2s ease, transform 0.2s ease;
}

.carousel__dot.active {
  background: #ffffff;
  transform: scale(1.3);
}

/* 슬라이드 카운터 */
.carousel__counter {
  position: absolute;
  top: 10px;
  right: 10px;
  font-family: 'Outfit', sans-serif;
  font-size: 0.7rem;
  font-weight: 500;
  color: #ffffff;
  background: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(4px);
  padding: 0.2rem 0.55rem;
  border-radius: 100px;
  z-index: 2;
}

/* 빈 이미지 플레이스홀더 */
.carousel__empty {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-tertiary);
  gap: 0.5rem;
}

.carousel__empty-icon {
  font-size: 2rem;
  opacity: 0.4;
}

.carousel__empty-text {
  font-size: 0.8rem;
}

/* ─── Card Body ─────────────────────────────────── */
.card__body {
  padding: 1rem 1.15rem 1.15rem;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.card__badges {
  display: flex;
  gap: 0.35rem;
  flex-wrap: wrap;
}

.badge {
  font-size: 0.68rem;
  font-weight: 600;
  padding: 0.15rem 0.5rem;
  border-radius: 4px;
  white-space: nowrap;
}

.badge--status {
  color: #ffffff;
}

.badge--status-초안       { background: var(--status-draft); }
.badge--status-디자인중   { background: var(--status-designing); }
.badge--status-검토       { background: var(--status-review); color: #1a1a1a; }
.badge--status-예약됨     { background: var(--status-scheduled); }
.badge--status-게시완료   { background: var(--status-published); }
.badge--status-보관       { background: var(--status-archived); }

.badge--type {
  border: 1px solid;
}

.badge--type-피드11 { color: var(--type-feed11); border-color: var(--type-feed11); }
.badge--type-피드45 { color: var(--type-feed45); border-color: var(--type-feed45); }
.badge--type-스토리 { color: var(--type-story); border-color: var(--type-story); }
.badge--type-릴스   { color: var(--type-reels); border-color: var(--type-reels); }

.card__title {
  font-size: 0.95rem;
  font-weight: 600;
  line-height: 1.4;
  color: var(--text-primary);
}

.card__title a {
  color: inherit;
  text-decoration: none;
}

.card__title a:hover {
  text-decoration: underline;
  text-decoration-color: var(--text-tertiary);
  text-underline-offset: 2px;
}

.card__caption {
  font-size: 0.8rem;
  color: var(--text-secondary);
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card__hashtags {
  font-size: 0.75rem;
  color: var(--text-tertiary);
  line-height: 1.5;
  word-break: break-all;
}

.card__date {
  font-family: 'Outfit', sans-serif;
  font-size: 0.75rem;
  color: var(--text-tertiary);
  margin-top: auto;
  padding-top: 0.4rem;
  border-top: 1px solid var(--border-light);
}

/* ─── Loading / Error / Empty ───────────────────── */
.state-message {
  max-width: 1400px;
  margin: 0 auto;
  padding: 4rem 2rem;
  text-align: center;
}

.state-message__icon {
  font-size: 2.5rem;
  margin-bottom: 1rem;
  opacity: 0.5;
}

.state-message__title {
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
}

.state-message__desc {
  font-size: 0.85rem;
  color: var(--text-secondary);
  max-width: 400px;
  margin: 0 auto;
  line-height: 1.6;
}

.state-message__retry {
  margin-top: 1.25rem;
}

.state-message__retry button {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.85rem;
  font-weight: 500;
  padding: 0.5rem 1.25rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-primary);
  cursor: pointer;
}

.state-message__retry button:hover {
  border-color: var(--text-secondary);
}

/* 스켈레톤 로딩 */
.skeleton-card {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.skeleton-media {
  aspect-ratio: 1 / 1;
  background: linear-gradient(90deg, var(--bg-carousel) 25%, #ebe9e4 50%, var(--bg-carousel) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}

.skeleton-body {
  padding: 1rem 1.15rem 1.15rem;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.skeleton-line {
  height: 0.8rem;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--border-light) 25%, var(--bg-carousel) 50%, var(--border-light) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}

.skeleton-line--short { width: 40%; }
.skeleton-line--medium { width: 70%; }
.skeleton-line--long { width: 100%; }

@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ─── 카드 등장 애니메이션 ──────────────────────── */
.card {
  animation: cardIn 0.35s ease-out both;
}

@keyframes cardIn {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>
<body>

<header class="header">
  <h1 class="header__title">Gallery</h1>
  <p class="header__subtitle" id="fetchInfo">데이터를 불러오는 중...</p>
</header>

<div class="toolbar" id="toolbar">
  <button class="filter-btn active" data-filter="all">전체</button>
  <button class="filter-btn" data-filter="초안">초안</button>
  <button class="filter-btn" data-filter="디자인 중">디자인 중</button>
  <button class="filter-btn" data-filter="검토">검토</button>
  <button class="filter-btn" data-filter="예약됨">예약됨</button>
  <button class="filter-btn" data-filter="게시완료">게시완료</button>
  <button class="filter-btn" data-filter="보관">보관</button>
  <span class="toolbar__spacer"></span>
  <span class="toolbar__count" id="postCount"></span>
  <button class="refresh-btn" id="refreshBtn" title="새로고침">
    <svg class="refresh-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"></polyline>
      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
    </svg>
    새로고침
  </button>
</div>

<main class="grid" id="gallery"></main>

<script>
(function () {
  "use strict";

  // ─── 설정 ──────────────────────────────────────
  var API_BASE = window.location.origin;
  var REFRESH_INTERVAL_MS = 55 * 60 * 1000; // 55분 (이미지 URL 만료 대응)

  // ─── DOM 참조 ──────────────────────────────────
  var gallery = document.getElementById("gallery");
  var fetchInfo = document.getElementById("fetchInfo");
  var postCount = document.getElementById("postCount");
  var refreshBtn = document.getElementById("refreshBtn");
  var toolbar = document.getElementById("toolbar");

  // ─── 상태 ──────────────────────────────────────
  var allPosts = [];
  var currentFilter = "all";
  var refreshTimer = null;

  // ─── 유틸: 피그마 URL → 임베드 URL 변환 ────────
  function toFigmaEmbedUrl(url) {
    if (!url) return null;
    // figma.com 도메인 확인
    if (url.indexOf("figma.com") === -1) return null;
    // 이미 embed URL이면 그대로 반환
    if (url.indexOf("figma.com/embed") !== -1) return url;
    return (
      "https://www.figma.com/embed?embed_host=notion&url=" +
      encodeURIComponent(url)
    );
  }

  // ─── 유틸: 날짜 포맷 ──────────────────────────
  function formatDate(dateObj) {
    if (!dateObj || !dateObj.start) return "";
    var d = new Date(dateObj.start);
    if (isNaN(d.getTime())) return dateObj.start;
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "." + m + "." + day;
  }

  // ─── 유틸: 상태 CSS 클래스명 ──────────────────
  function statusClass(status) {
    if (!status) return "";
    return "badge--status-" + status.replace(/\s/g, "");
  }

  // ─── 유틸: 유형 CSS 클래스명 ──────────────────
  function typeClass(type) {
    if (!type) return "";
    var map = {
      "피드 1:1": "badge--type-피드11",
      "피드 4:5": "badge--type-피드45",
      "스토리": "badge--type-스토리",
      "릴스": "badge--type-릴스",
    };
    return map[type] || "";
  }

  // ─── 유틸: 게시 유형에 따른 비율 클래스 ────────
  function ratioClass(type) {
    if (type === "피드 4:5") return "carousel--ratio-45";
    if (type === "스토리") return "carousel--ratio-story";
    return ""; // 기본 1:1
  }

  // ─── 유틸: HTML 이스케이프 ─────────────────────
  function esc(str) {
    if (!str) return "";
    var div = document.createElement("div");
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  // ─── 스켈레톤 렌더 ────────────────────────────
  function renderSkeleton() {
    var html = "";
    for (var i = 0; i < 6; i++) {
      html +=
        '<div class="skeleton-card">' +
          '<div class="skeleton-media"></div>' +
          '<div class="skeleton-body">' +
            '<div class="skeleton-line skeleton-line--short"></div>' +
            '<div class="skeleton-line skeleton-line--long"></div>' +
            '<div class="skeleton-line skeleton-line--medium"></div>' +
          '</div>' +
        '</div>';
    }
    gallery.innerHTML = html;
  }

  // ─── 에러 메시지 렌더 ─────────────────────────
  function renderError(title, desc) {
    gallery.innerHTML =
      '<div class="state-message" style="grid-column:1/-1">' +
        '<div class="state-message__icon">⚠</div>' +
        '<div class="state-message__title">' + esc(title) + '</div>' +
        '<div class="state-message__desc">' + esc(desc) + '</div>' +
        '<div class="state-message__retry">' +
          '<button onclick="location.reload()">다시 시도</button>' +
        '</div>' +
      '</div>';
  }

  // ─── 빈 상태 렌더 ────────────────────────────
  function renderEmpty() {
    gallery.innerHTML =
      '<div class="state-message" style="grid-column:1/-1">' +
        '<div class="state-message__icon">📭</div>' +
        '<div class="state-message__title">게시물이 없습니다</div>' +
        '<div class="state-message__desc">' +
          (currentFilter !== "all"
            ? "'" + esc(currentFilter) + "' 상태의 게시물이 없습니다."
            : "노션 데이터베이스에 게시물을 추가해 주세요.") +
        '</div>' +
      '</div>';
  }

  // ─── 카드 HTML 생성 ───────────────────────────
  function buildCardHTML(post, index) {
    var hasImages = post.images && post.images.length > 0;
    var figmaEmbed = toFigmaEmbedUrl(post.figmaUrl);
    var totalSlides = (hasImages ? post.images.length : 0) + (figmaEmbed ? 1 : 0);
    var carouselId = "carousel-" + index;
    var rClass = ratioClass(post.postType);

    // 카루셀 영역
    var mediaHTML = '<div class="carousel ' + rClass + '" id="' + carouselId + '">';

    if (totalSlides === 0) {
      // 이미지도 피그마도 없는 경우
      mediaHTML +=
        '<div class="carousel__empty">' +
          '<div class="carousel__empty-icon">🖼</div>' +
          '<div class="carousel__empty-text">미디어 없음</div>' +
        '</div>';
    } else {
      // 트랙
      mediaHTML += '<div class="carousel__track" data-carousel-track>';

      // 이미지 슬라이드
      if (hasImages) {
        for (var i = 0; i < post.images.length; i++) {
          mediaHTML +=
            '<div class="carousel__slide">' +
              '<img src="' + esc(post.images[i].url) + '" ' +
                'alt="' + esc(post.title || "슬라이드") + " " + (i + 1) + '" ' +
                'loading="lazy" ' +
                'onerror="this.parentElement.innerHTML=\'<div class=carousel__empty><div class=carousel__empty-icon>⚠</div><div class=carousel__empty-text>이미지 만료</div></div>\'">' +
            '</div>';
        }
      }

      // 피그마 슬라이드 (마지막에 추가)
      if (figmaEmbed) {
        mediaHTML +=
          '<div class="carousel__slide carousel__slide--figma">' +
            '<iframe src="' + esc(figmaEmbed) + '" ' +
              'allowfullscreen ' +
              'loading="lazy" ' +
              'sandbox="allow-scripts allow-same-origin allow-popups">' +
            '</iframe>' +
          '</div>';
      }

      mediaHTML += '</div>'; // track 닫기

      // 슬라이드 카운터
      if (totalSlides > 1) {
        mediaHTML +=
          '<span class="carousel__counter" data-carousel-counter>1 / ' + totalSlides + '</span>';

        // 네비게이션 버튼
        mediaHTML +=
          '<button class="carousel__nav-btn carousel__nav-btn--prev" data-carousel-prev aria-label="이전" disabled>' +
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>' +
          '</button>' +
          '<button class="carousel__nav-btn carousel__nav-btn--next" data-carousel-next aria-label="다음">' +
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>' +
          '</button>';

        // 도트 인디케이터
        mediaHTML += '<div class="carousel__dots">';
        for (var d = 0; d < totalSlides; d++) {
          mediaHTML +=
            '<span class="carousel__dot' + (d === 0 ? " active" : "") + '"></span>';
        }
        mediaHTML += '</div>';
      }
    }

    mediaHTML += '</div>'; // carousel 닫기

    // 카드 바디
    var bodyHTML = '<div class="card__body">';

    // 뱃지 행
    bodyHTML += '<div class="card__badges">';
    if (post.status) {
      bodyHTML +=
        '<span class="badge badge--status ' + statusClass(post.status) + '">' +
          esc(post.status) +
        '</span>';
    }
    if (post.postType) {
      bodyHTML +=
        '<span class="badge badge--type ' + typeClass(post.postType) + '">' +
          esc(post.postType) +
        '</span>';
    }
    bodyHTML += '</div>';

    // 제목
    if (post.title) {
      bodyHTML +=
        '<h2 class="card__title">' +
          '<a href="' + esc(post.notionUrl) + '" target="_blank" rel="noopener">' +
            esc(post.title) +
          '</a>' +
        '</h2>';
    }

    // 캡션
    if (post.caption) {
      bodyHTML +=
        '<p class="card__caption">' + esc(post.caption) + '</p>';
    }

    // 해시태그
    if (post.hashtags) {
      bodyHTML +=
        '<p class="card__hashtags">' + esc(post.hashtags) + '</p>';
    }

    // 날짜
    var dateStr = formatDate(post.scheduledDate);
    if (dateStr) {
      bodyHTML +=
        '<div class="card__date">' + dateStr + '</div>';
    }

    bodyHTML += '</div>';

    return (
      '<article class="card" style="animation-delay:' + (index * 0.04) + 's">' +
        mediaHTML +
        bodyHTML +
      '</article>'
    );
  }

  // ─── 갤러리 렌더 ──────────────────────────────
  function renderGallery() {
    var filtered =
      currentFilter === "all"
        ? allPosts
        : allPosts.filter(function (p) { return p.status === currentFilter; });

    postCount.textContent = filtered.length + "개 게시물";

    if (filtered.length === 0) {
      renderEmpty();
      return;
    }

    var html = "";
    for (var i = 0; i < filtered.length; i++) {
      html += buildCardHTML(filtered[i], i);
    }
    gallery.innerHTML = html;

    // 카루셀 이벤트 바인딩
    initCarousels();
  }

  // ─── 카루셀 이벤트 초기화 ─────────────────────
  function initCarousels() {
    var carousels = gallery.querySelectorAll(".carousel");

    carousels.forEach(function (el) {
      var track = el.querySelector("[data-carousel-track]");
      if (!track) return;

      var prevBtn = el.querySelector("[data-carousel-prev]");
      var nextBtn = el.querySelector("[data-carousel-next]");
      var counter = el.querySelector("[data-carousel-counter]");
      var dots = el.querySelectorAll(".carousel__dot");
      var slides = track.querySelectorAll(".carousel__slide");
      var total = slides.length;

      if (total <= 1) return;

      function getCurrentIndex() {
        var scrollLeft = track.scrollLeft;
        var slideWidth = track.offsetWidth;
        return Math.round(scrollLeft / slideWidth);
      }

      function updateUI() {
        var idx = getCurrentIndex();
        if (counter) {
          counter.textContent = (idx + 1) + " / " + total;
        }
        if (prevBtn) prevBtn.disabled = idx === 0;
        if (nextBtn) nextBtn.disabled = idx >= total - 1;
        dots.forEach(function (dot, i) {
          dot.classList.toggle("active", i === idx);
        });
      }

      if (prevBtn) {
        prevBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          var idx = getCurrentIndex();
          if (idx > 0) {
            track.scrollTo({ left: (idx - 1) * track.offsetWidth, behavior: "smooth" });
          }
        });
      }

      if (nextBtn) {
        nextBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          var idx = getCurrentIndex();
          if (idx < total - 1) {
            track.scrollTo({ left: (idx + 1) * track.offsetWidth, behavior: "smooth" });
          }
        });
      }

      track.addEventListener("scroll", debounce(updateUI, 50));
      updateUI();
    });
  }

  // ─── 유틸: 디바운스 ───────────────────────────
  function debounce(fn, ms) {
    var timer;
    return function () {
      clearTimeout(timer);
      timer = setTimeout(fn, ms);
    };
  }

  // ─── 데이터 로드 ──────────────────────────────
  function loadPosts() {
    refreshBtn.classList.add("loading");
    fetchInfo.textContent = "데이터를 불러오는 중...";

    fetch(API_BASE + "/api/posts")
      .then(function (res) {
        if (!res.ok) {
          return res.json().then(function (body) {
            throw new Error(body.error || "HTTP " + res.status);
          });
        }
        return res.json();
      })
      .then(function (data) {
        if (!data.success) {
          throw new Error(data.error || "알 수 없는 오류");
        }

        allPosts = data.posts || [];
        var time = new Date(data.fetchedAt);
        var timeStr =
          time.getHours().toString().padStart(2, "0") + ":" +
          time.getMinutes().toString().padStart(2, "0");
        fetchInfo.textContent =
          "마지막 업데이트: " + timeStr + " · " + data.count + "개 항목";

        renderGallery();
        scheduleRefresh();
      })
      .catch(function (err) {
        console.error("API 호출 실패:", err);
        fetchInfo.textContent = "데이터 로드 실패";
        renderError(
          "데이터를 불러올 수 없습니다",
          err.message || "서버 연결을 확인해 주세요."
        );
      })
      .finally(function () {
        refreshBtn.classList.remove("loading");
      });
  }

  // ─── 자동 새로고침 (이미지 URL 만료 대응) ────
  function scheduleRefresh() {
    if (refreshTimer) clearTimeout(refreshTimer);
    refreshTimer = setTimeout(function () {
      console.log("[Auto-refresh] 이미지 URL 갱신을 위해 데이터 재로드");
      loadPosts();
    }, REFRESH_INTERVAL_MS);
  }

  // ─── 필터 이벤트 ──────────────────────────────
  toolbar.addEventListener("click", function (e) {
    var btn = e.target.closest(".filter-btn");
    if (!btn) return;

    toolbar.querySelectorAll(".filter-btn").forEach(function (b) {
      b.classList.remove("active");
    });
    btn.classList.add("active");

    currentFilter = btn.getAttribute("data-filter");
    renderGallery();
  });

  // ─── 새로고침 버튼 ────────────────────────────
  refreshBtn.addEventListener("click", function () {
    loadPosts();
  });

  // ─── 초기 로드 ────────────────────────────────
  renderSkeleton();
  loadPosts();
})();
</script>
</body>
